<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Flip</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --pixel-bg: #1a1a2e;
            --coin-gold: linear-gradient(45deg, #d4af37, #f1c40f, #9a7d0a);
            --coin-silver: linear-gradient(45deg, #bdc3c7, #ecf0f1, #7f8c8d);
        }

        body {
            /* Pixelated background pattern using CSS */
            background-color: var(--pixel-bg);
            background-image: 
                linear-gradient(45deg, #16213e 25%, transparent 25%), 
                linear-gradient(-45deg, #16213e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #16213e 75%), 
                linear-gradient(-45deg, transparent 75%, #16213e 75%);
            background-size: 40px 40px; /* Big pixels */
            color: white;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 50px;
            border: 6px solid #fff;
            image-rendering: pixelated; /* Ensures the borders look sharp */
            box-shadow: 12px 12px 0px #000;
        }

        /* The Realistic Coin */
        #coin {
            width: 120px;
            height: 120px;
            background: var(--coin-gold);
            border-radius: 50%;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: rgba(0,0,0,0.3);
            font-weight: bold;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 0 20px rgba(241, 196, 15, 0.4);
            border: 4px solid #b7950b;
            transition: transform 0.1s;
        }

        .flipping {
            animation: flipAnim 0.15s infinite linear;
        }

        @keyframes flipAnim {
            0% { transform: rotateY(0deg) scale(1.1); }
            100% { transform: rotateY(180deg) scale(1.1); }
        }

        button {
            background-color: #e94560;
            color: white;
            border: 4px solid #fff;
            padding: 15px 20px;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            box-shadow: 6px 6px 0px #530a16;
            image-rendering: pixelated;
        }

        button:active {
            box-shadow: none;
            transform: translate(6px, 6px);
        }

        #quote-display {
            margin-top: 30px;
            font-size: 12px;
            color: #4db8ff;
            height: 20px;
        }

        footer {
            position: fixed;
            bottom: 20px;
            font-size: 9px;
            color: #666;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="coin">$</div>
        <button onclick="flip()">DECIDE</button>
        <div id="quote-display">Trust the 50/50</div>
    </div>

    <footer>made with love &lt;3 - AR</footer>

    <script>
        const quotes = [
            "Trust the 50/50",
            "Peak decision making",
            "Coin knows more"
        ];

        function flip() {
            const coin = document.getElementById('coin');
            const quoteText = document.getElementById('quote-display');
            
            coin.classList.add('flipping');
            coin.innerText = "?";

            setTimeout(() => {
                coin.classList.remove('flipping');
                const isHeads = Math.random() < 0.5;
                
                coin.innerText = isHeads ? "H" : "T";
                coin.style.background = isHeads ? 'var(--coin-gold)' : 'var(--coin-silver)';
                coin.style.borderColor = isHeads ? '#b7950b' : '#7f8c8d';

                // Cycle through your quotes
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                quoteText.innerText = randomQuote;
            }, 800);
        }
    </script>
</body>
</html>
